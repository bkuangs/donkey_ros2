target_ekf:
  ros__parameters:
    target_topic: /perception/target_centroid
    state_topic: /tracking/target_state
    filtered_centroid_topic: /tracking/target_centroid_filtered
    publish_rate_hz: 30.0
    stale_timeout_sec: 0.5

    # Tuned for image-space tracking: x/y are pixels, z is contour area.
    process_noise_position: 25.0
    process_noise_area: 2500.0
    process_noise_velocity: 100.0
    process_noise_area_velocity: 10000.0

    measurement_noise_position: 25.0
    measurement_noise_area: 2500.0
