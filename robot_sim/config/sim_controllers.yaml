controller_manager:
  ros__parameters:
    update_rate: 50 # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    steering_joints_names:
      - front_right_steer_joint
      - front_left_steer_joint
    traction_joints_names:
      - rear_right_wheel_joint
      - rear_left_wheel_joint

    # Kinematics Calibration
    wheelbase: 0.24        
    traction_track_width: 0.18
    steering_track_width: 0.18
    traction_wheels_radius: 0.033

    # Odometry Configuration
    position_feedback: false      # Use joint velocity state to compute odom (true uses position -> .nan)
    open_loop: false              # False means it calculates odometry from encoder state feedback

    # Frames
    odom_frame_id: odom
    base_frame_id: base_footprint
    twist_covariance_diagonal: [0.01, 0.01, 1.0, 1.0, 1.0, 0.02]
    # The v0 application consumes simulator ground truth instead of wheel odometry.
    enable_odom_tf: false

    reference_timeout: 2.0