vio_adapter:
  ros__parameters:
    input_topic: /ov_msckf/odomimu
    output_topic: /vio/odom
    input_child_frame: imu_link
    base_frame: base_footprint
    output_frame: odom
    position_variance: 0.05
    yaw_variance: 0.02

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Encoder odometry contributes only independent wheel-derived motion.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # OpenVINS contributes the locally drifting metric pose.
    odom1: /vio/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 10
