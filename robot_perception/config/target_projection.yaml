color_detection:
  ros__parameters:
    target_topic: /perception/target_detection
    min_contour_area: 100.0
    minimum_saturation: 100
    minimum_value: 100
    low_red_maximum_hue: 10
    high_red_minimum_hue: 170

target_projector:
  ros__parameters:
    detection_topic: /perception/target_detection
    depth_topic: /camera/depth_image
    camera_info_topic: /camera/camera_info
    odometry_topic: /ground_truth/odom
    output_topic: /perception/target_position
    camera_frame: camera_optical_frame
    base_frame: base_footprint
    output_frame: odom
    min_depth: 0.1
    max_depth: 20.0
    target_radius: 0.2
    sample_fraction: 0.5
    depth_variance_base: 0.0025
    depth_variance_scale: 0.001
    pixel_variance: 1.0
    sync_tolerance: 0.05
    transform_timeout: 0.05
