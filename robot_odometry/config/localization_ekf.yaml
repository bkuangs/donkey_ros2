localization_ekf:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    predict_to_current_time: true
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry supplies continuous planar velocity without duplicating its
    # encoder-derived pose.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # RGB-D odometry corrects the integrated wheel pose when registration is valid.
    odom1: /localization/visual_odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false
    odom1_pose_rejection_threshold: 5.0
