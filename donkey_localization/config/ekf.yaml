ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map              # Defaults for coordinate frames
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel Odometry Config
    odom0: /odom
    odom0_config: [true,  true,  false, # x,   y,   z
                   false, false, true,  # roll, pitch, yaw
                   true,  false, false, # x_vel, y_vel, z_vel
                   false, false, true,  # roll_vel, pitch_vel, yaw_vel
                   false, false, false] # ax,   ay,   az

    # IMU Config
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,   # yaw
                  false, false, false,
                  false, false, true,   # yaw_vel
                  true,  false, false]  # x_acceleration